name: Abbott AutoCapture MAUDE sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/abbott-autocapture-maude.yml"
      - "cied-surveillance/pipelines/maude_abbott_autocapture_pull.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - "2010 2011 2012 2013 2014"
          - "2015 2016 2017 2018 2019"
          - "2020 2021 2022 2023 2024"
          - "2025 current"
    steps:
      - uses: actions/checkout@v5
      - name: Set chunk label
        run: echo "LABEL=$(echo '${{ matrix.chunk }}' | tr ' ' '-')" >> "$GITHUB_ENV"
      - name: Run AutoCapture sweep
        run: |
          python cied-surveillance/pipelines/maude_abbott_autocapture_pull.py \
            --periods ${{ matrix.chunk }} \
            --output-dir cied-surveillance/warehouse/autocapture-$LABEL
      - name: Show summary
        if: always()
        run: |
          test -f cied-surveillance/warehouse/autocapture-${{ env.LABEL }}/summary.json && cat cied-surveillance/warehouse/autocapture-${{ env.LABEL }}/summary.json || true
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abbott-autocapture-${{ env.LABEL }}
          path: |
            cied-surveillance/warehouse/autocapture-${{ env.LABEL }}/autocapture_candidates.csv
            cied-surveillance/warehouse/autocapture-${{ env.LABEL }}/summary.json
          retention-days: 14
          compression-level: 9
