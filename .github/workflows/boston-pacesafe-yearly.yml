name: Boston PaceSafe yearly MAUDE sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/boston-pacesafe-yearly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, current]
    steps:
      - uses: actions/checkout@v5
      - name: Run year
        run: |
          python cied-surveillance/pipelines/maude_boston_pacesafe_pull.py \
            --periods ${{ matrix.year }} \
            --output-dir cied-surveillance/warehouse/boston-pacesafe-${{ matrix.year }}
      - name: Show summary
        if: always()
        run: cat cied-surveillance/warehouse/boston-pacesafe-${{ matrix.year }}/summary.json || true
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boston-pacesafe-${{ matrix.year }}
          path: |
            cied-surveillance/warehouse/boston-pacesafe-${{ matrix.year }}/pacesafe_candidates.csv
            cied-surveillance/warehouse/boston-pacesafe-${{ matrix.year }}/summary.json
          retention-days: 14
