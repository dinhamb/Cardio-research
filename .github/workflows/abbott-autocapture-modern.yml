name: Abbott AutoCapture modern yearly sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/abbott-autocapture-modern.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024]
    steps:
      - uses: actions/checkout@v5
      - name: Run year
        run: |
          python cied-surveillance/pipelines/maude_abbott_autocapture_pull.py \
            --periods ${{ matrix.year }} \
            --output-dir cied-surveillance/warehouse/autocapture-${{ matrix.year }}
      - name: Show summary
        if: always()
        run: cat cied-surveillance/warehouse/autocapture-${{ matrix.year }}/summary.json || true
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abbott-autocapture-${{ matrix.year }}
          path: |
            cied-surveillance/warehouse/autocapture-${{ matrix.year }}/autocapture_candidates.csv
            cied-surveillance/warehouse/autocapture-${{ matrix.year }}/summary.json
          retention-days: 14
