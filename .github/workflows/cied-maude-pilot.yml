name: CIED MAUDE 2025 + current backfill

on:
  push:
    branches: [main]
    paths:
      - "cied-surveillance/pipelines/maude_header_interface_pull.py"
      - ".github/workflows/cied-maude-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run 2025 and current targeted pull
        run: |
          python cied-surveillance/pipelines/maude_header_interface_pull.py \
            --periods 2025 current \
            --output-dir cied-surveillance/warehouse/maude-header-2025-current

      - name: Show compact summary
        if: always()
        run: |
          if [ -f cied-surveillance/warehouse/maude-header-2025-current/summary.json ]; then
            cat cied-surveillance/warehouse/maude-header-2025-current/summary.json
          fi

      - name: Upload compact candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maude-header-interface-2025-current
          path: |
            cied-surveillance/warehouse/maude-header-2025-current/header_interface_candidates.csv
            cied-surveillance/warehouse/maude-header-2025-current/summary.json
          retention-days: 14
          compression-level: 9
