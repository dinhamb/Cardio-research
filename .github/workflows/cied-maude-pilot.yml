name: CIED MAUDE header-interface pilot

on:
  push:
    branches: [main]
    paths:
      - "cied-surveillance/pipelines/maude_header_interface_pull.py"
      - ".github/workflows/cied-maude-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run current-year targeted pull
        run: |
          python cied-surveillance/pipelines/maude_header_interface_pull.py \
            --periods current \
            --output-dir cied-surveillance/warehouse/maude-header-pilot

      - name: Show compact summary
        if: always()
        run: |
          if [ -f cied-surveillance/warehouse/maude-header-pilot/summary.json ]; then
            cat cied-surveillance/warehouse/maude-header-pilot/summary.json
          fi

      - name: Upload compact candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maude-header-interface-pilot
          path: |
            cied-surveillance/warehouse/maude-header-pilot/header_interface_candidates.csv
            cied-surveillance/warehouse/maude-header-pilot/summary.json
          retention-days: 14
          compression-level: 9
