name: MAUDE 2025 device layout probe
on:
  push:
    branches: [main]
    paths:
      - "cied-surveillance/pipelines/probe_device2025_layout.py"
      - ".github/workflows/cied-maude-2025-layout-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python cied-surveillance/pipelines/probe_device2025_layout.py
